name: Create Jira issue

on:
  issues:
    types: [opened]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      # 1. Jira 로그인
      - name: Jira Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      # 2. 템플릿 파일 읽기 (develop 브랜치 기준)
      - name: Checkout develop code
        uses: actions/checkout@v4
        with:
          ref: develop

      # 3. 이슈 폼 데이터 파싱 (id 매칭: parentKey, branchName, branchPrefix)
      - name: Issue Parser
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/task.yml
      
      # 3.1 브랜치 생성 로그
      - name: Log Issue Parser
        run: |
          echo '${{ steps.issue-parser.outputs.jsonString }}'

      # 4. 마크다운을 Jira 구문으로 변환
      - name: Convert markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### GitHub Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      # 5. Jira 이슈 생성 (Task로 독립 생성)
      - name: Create Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: PO
          issuetype: Task
          summary: "${{ github.event.issue.title }}"
          description: "${{ steps.md2jira.outputs.output-text }}"

      - name: Log created issue
        run: echo "Jira Issue ${{ steps.issue-parser.outputs.parentKey }}/$ {{steps.create.outputs.issue }} was created"
        
      # 6. 프리픽스를 반영한 브랜치 생성 및 푸시
      - name: Create branch with Ticket number
        run: |
          # 변수 할당
          PREFIX="${{ steps.issue-parser.outputs.issueparser_branchPrefix }}"
          TICKET="${{ steps.create.outputs.issue }}"
          SLUG="${{ steps.issue-parser.outputs.issueparser_branchName }}"

          # prefix/#ticket-slug (예: feat/#PO-10_login-view)
          BRANCH_NAME="${PREFIX}/#${TICKET}_${SLUG}"

          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      # 7. GitHub 이슈 제목에 생성된 Jira 키 업데이트
      - name: Update Issue Title
        uses: actions-cool/issues-helper@v3
        with:
          actions: "update-issue"
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[${{ steps.create.outputs.issue }}] ${{ github.event.issue.title }}"